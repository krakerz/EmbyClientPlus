[package]
name = "embyclientplus"
version = "0.1.0"
edition = "2024"
description = "Linux-native Emby client with client-side frame interpolation/frame generation during playback"
license = "GPL-3.0-or-later"
repository = "https://github.com/krakerz/EmbyClientPlus"

[[bin]]
name = "embyclientplus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
keyring = "4.2.0"
mpvipc = "1.3.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["x11"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x11rb = "0.14.0"

[build-dependencies]
tauri-build = "2.6.3"
