[package]
name = "embyclientplus"
version = "0.7.0"
edition = "2024"
description = "Native Linux Emby client with SVP frame interpolation"
license = "GPL-3.0-or-later"
repository = "https://github.com/krakerz/EmbyClientPlus"

[[bin]]
name = "embyclientplus"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6", "gtk_v4_10"] }
anyhow = "1.0.104"
directories = "6.0.0"
gilrs = "0.11.2"
glow = "0.16"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
keyring = "4.2.0"
libc = "0.2.189"
libloading = "0.9.0"
libmpv2 = "6.0.0"
libmpv2-sys = "4.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
