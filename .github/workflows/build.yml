name: Build

on:
  push:
    branches: [main]
    paths-ignore: [README.md, CHANGELOG.md, LICENSE, INSTALL.txt, .gitignore]
  # Run by hand from the Actions tab: one platform only, and a quick mode
  # that skips the checks, for testing a build. Such runs make no release;
  # the package is on the run's page under Artifacts.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, linux, windows, macos]
        default: all
      quick:
        description: Quick build (skip format, clippy and tests)
        type: boolean
        default: false

permissions:
  contents: write

env:
  # No debug info in CI's test builds: smaller caches, faster links.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    # Hosted Ubuntu images lack libadwaita >= 1.6 and VapourSynth headers;
    # Arch has current GTK/libadwaita/FFmpeg/libplacebo and matches the
    # development machine.
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust meson ninja pkgconf curl file patchelf \
            gtk4 libadwaita ffmpeg libplacebo libass vapoursynth zimg lcms2 uchardet \
            wayland wayland-protocols libxkbcommon libxpresent libxss libxv libxrandr \
            libdrm mesa vulkan-headers vulkan-icd-loader libva libvdpau libdisplay-info \
            pipewire libpulse alsa-lib systemd-libs desktop-file-utils \
            xorg-server-xvfb xorg-xauth strace nss-mdns

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keyed on dependencies, not the app's own version, so a release
      # doesn't re-upload the cache; only dependency builds are kept.
      - uses: Swatinem/rust-cache@v2

      - name: Cache libmpv
        uses: actions/cache@v4
        with:
          path: |
            third_party/mpv-src
            third_party/mpv-build
            third_party/mpv-prefix
          key: libmpv-${{ hashFiles('scripts/build-libmpv.sh') }}

      - name: Build libmpv
        run: scripts/build-libmpv.sh

      - name: Format
        if: ${{ !inputs.quick }}
        run: cargo fmt -- --check

      - name: Clippy
        if: ${{ !inputs.quick }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        if: ${{ !inputs.quick }}
        run: cargo test --locked

      - name: Build release binary
        env:
          EMBYCLIENTPLUS_PORTABLE: "1"
        run: cargo build --release --locked

      - name: Resolve version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # The version's section plus anything still under [Unreleased]: a
          # push without a version bump replaces this version's binaries,
          # so its notes are refreshed with those changes too.
          scripts/release-notes.sh "$version" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            {
              echo "No CHANGELOG.md section for $version; commits since ${previous:-the beginning}:"
              echo ""
              git log --pretty='- %s' ${previous:+"$previous"..HEAD}
            } > release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo "[Full changelog](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } >> release-notes.md

      - name: Package
        run: |
          packaging/package.sh
          cp release-notes.md dist/

      # The pinned quick-sharun (packaging/appimage/quick-sharun.pin) for the
      # compat AppImage; the pin file is the cache key.
      - name: Cache quick-sharun
        uses: actions/cache@v4
        with:
          path: packaging/tools/quick-sharun-*.sh
          key: quick-sharun-${{ hashFiles('packaging/appimage/quick-sharun.pin') }}

      # Same binary and libmpv as the main AppImage, packed with its own
      # glibc for old distros. Its own step and allowed to fail: without it
      # the release simply goes out without the compat file (see compat-test
      # and the release job).
      - name: Compat AppImage
        id: compat
        continue-on-error: true
        run: packaging/appimage/make-compat-appimage.sh

      - name: Compat AppImage failed
        if: steps.compat.outcome == 'failure'
        run: echo "::warning::the compat AppImage failed to build; the release goes out without it"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*-linux-x86_64.tar.gz
            dist/*.AppImage
            dist/*-steam-library.zip
            dist/release-notes.md

  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # No full package update: it cost ~2 min a run, and a fresh
          # runner's MSYS2 is recent enough.
          update: false
          # MSYS2's mpv is built with vapoursynth, so no libmpv of our own.
          pacboy: >-
            rust:p pkgconf:p gcc:p gtk4:p libadwaita:p mpv:p
            gdk-pixbuf2:p librsvg:p ntldd:p adwaita-icon-theme:p hicolor-icon-theme:p
          install: zip

      - uses: actions/checkout@v4

      # MSYS2's cargo would use MSYS2's home, which the cache doesn't see.
      - name: Point cargo's home at the cache
        shell: pwsh
        run: '"CARGO_HOME=$env:RUNNER_TEMP\cargo-home" >> $env:GITHUB_ENV'

      # rustc/cargo queries go through MSYS2, whose Rust is the one building.
      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: msys2 -c "{0}"

      - name: Clippy
        if: ${{ !inputs.quick }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        if: ${{ !inputs.quick }}
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: packaging/package-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-windows-x86_64.zip

  macos:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-14
    steps:
      - name: Install dependencies
        # Homebrew's mpv is built with vapoursynth, so no libmpv of our own;
        # bash 5 for the packaging script (macOS ships 3.2).
        run: brew install rust pkgconf gtk4 libadwaita adwaita-icon-theme hicolor-icon-theme mpv librsvg bash

      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        if: ${{ !inputs.quick }}
        run: LIBRARY_PATH="$(brew --prefix)/lib" cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        if: ${{ !inputs.quick }}
        run: LIBRARY_PATH="$(brew --prefix)/lib" cargo test --locked

      - name: Build release binary
        run: LIBRARY_PATH="$(brew --prefix)/lib" cargo build --release --locked

      - name: Package
        run: packaging/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*-macos-arm64.zip

  # Runs the compat AppImage on old distros (docker on the hosted runner).
  # Never blocks the release: if any image fails, the release job drops the
  # compat file and publishes the rest.
  compat-test:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest stable releases only (the tags follow new releases).
        image: ["debian:stable", "ubuntu:latest"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts

      - name: Find the compat AppImage
        id: find
        run: |
          file="$(ls artifacts/*-x86_64-compat.AppImage 2>/dev/null | head -n 1 || true)"
          if [ -z "$file" ]; then
            echo "::warning::no compat AppImage in the build; nothing to test"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Test on ${{ matrix.image }}
        if: steps.find.outputs.file != ''
        env:
          LOG_DIR: ${{ runner.temp }}/compat-logs
        run: scripts/test-appimage-compat.sh "${{ steps.find.outputs.file }}" "${{ matrix.image }}"

      - name: Logs
        if: failure()
        run: |
          for log in "${{ runner.temp }}"/compat-logs/*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done

  release:
    needs: [build, windows, macos, compat-test]
    # Only full runs publish (a push, or a manual run of everything, checked).
    # compat-test may fail (or be skipped) without stopping the release, so
    # the other jobs are checked by hand.
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && needs.windows.result == 'success'
      && needs.macos.result == 'success'
      && (github.event_name == 'push' || (inputs.platform == 'all' && !inputs.quick)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      # A draft has no tag yet, so same-version pushes still refresh it; once
      # published (tagged), never overwrite its assets — bump the version.
      - name: Check the version isn't released yet
        id: gate
        run: |
          version="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "::notice::$version is already released; bump the version to publish a new one"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # The compat AppImage ships only when it was built and passed on every
      # old distro; otherwise it is dropped, also from a draft an earlier
      # push of this version already put it in.
      - name: Compat AppImage gate
        if: steps.gate.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          result="${{ needs.compat-test.result }}"
          shopt -s nullglob
          files=(artifacts/*-x86_64-compat.AppImage)
          if [ ${#files[@]} -gt 0 ] && [ "$result" = success ]; then
            exit 0
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::no compat AppImage was built; releasing without it"
          else
            rm -f "${files[@]}"
            echo "::warning::compat AppImage tests ended as '$result'; releasing without it"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$version\") | .assets[] | select(.name | endswith(\"-x86_64-compat.AppImage\")) | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" ||
                echo "::warning::couldn't delete the earlier compat asset $id from the draft"
            done

      - name: Draft release
        if: steps.gate.outputs.released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: artifacts/release-notes.md
          files: |
            artifacts/*-linux-x86_64.tar.gz
            artifacts/*.AppImage
            artifacts/*-steam-library.zip
            artifacts/*-windows-x86_64.zip
            artifacts/*-macos-arm64.zip
