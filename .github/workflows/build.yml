name: Build

on:
  push:
    branches: [main]
    paths-ignore: [README.md, CHANGELOG.md, LICENSE, INSTALL.txt, .gitignore]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Hosted Ubuntu images lack libadwaita >= 1.6 and VapourSynth headers;
    # Arch has current GTK/libadwaita/FFmpeg/libplacebo and matches the
    # development machine.
    container: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust meson ninja pkgconf curl file patchelf \
            gtk4 libadwaita ffmpeg libplacebo libass vapoursynth zimg lcms2 uchardet \
            wayland wayland-protocols libxkbcommon libxpresent libxss libxv libxrandr \
            libdrm mesa vulkan-headers vulkan-icd-loader libva libvdpau libdisplay-info \
            pipewire libpulse alsa-lib systemd-libs desktop-file-utils

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Cache libmpv
        uses: actions/cache@v4
        with:
          path: |
            third_party/mpv-src
            third_party/mpv-build
            third_party/mpv-prefix
          key: libmpv-${{ hashFiles('scripts/build-libmpv.sh') }}

      - name: Build libmpv
        run: scripts/build-libmpv.sh

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        env:
          EMBYCLIENTPLUS_PORTABLE: "1"
        run: cargo build --release --locked

      - name: Resolve version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # The version's section plus anything still under [Unreleased]: a
          # push without a version bump replaces this version's binaries,
          # so its notes are refreshed with those changes too.
          scripts/release-notes.sh "$version" > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            {
              echo "No CHANGELOG.md section for $version; commits since ${previous:-the beginning}:"
              echo ""
              git log --pretty='- %s' ${previous:+"$previous"..HEAD}
            } > release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo "[Full changelog](${{ github.server_url }}/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } >> release-notes.md

      - name: Package
        run: |
          packaging/package.sh
          cp release-notes.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*-linux-x86_64.tar.gz
            dist/*.AppImage
            dist/release-notes.md

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # MSYS2's mpv is built with vapoursynth, so no libmpv of our own.
          pacboy: >-
            rust:p pkgconf:p gcc:p gtk4:p libadwaita:p mpv:p
            gdk-pixbuf2:p librsvg:p ntldd:p
          install: zip

      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: packaging/package-windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-windows-x86_64.zip

  macos:
    runs-on: macos-14
    steps:
      - name: Install dependencies
        # Homebrew's mpv is built with vapoursynth, so no libmpv of our own;
        # bash 5 for the packaging script (macOS ships 3.2).
        run: brew install rust pkgconf gtk4 libadwaita mpv librsvg bash

      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Clippy
        run: LIBRARY_PATH="$(brew --prefix)/lib" cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: LIBRARY_PATH="$(brew --prefix)/lib" cargo test --locked

      - name: Build release binary
        run: LIBRARY_PATH="$(brew --prefix)/lib" cargo build --release --locked

      - name: Package
        run: packaging/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*-macos-arm64.tar.gz

  release:
    needs: [build, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: artifacts/release-notes.md
          files: |
            artifacts/*-linux-x86_64.tar.gz
            artifacts/*.AppImage
            artifacts/*-windows-x86_64.zip
            artifacts/*-macos-arm64.tar.gz
